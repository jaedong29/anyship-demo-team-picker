<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>팀 자동 배정</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="intro">
      <h1>팀 자동 배정</h1>
      <p>참가자 이름을 한 줄에 한 명씩 입력하고 팀 수를 고르면, 인원이 고르게 섞인 팀을 만들어 드립니다.</p>
    </header>

    <section class="card" aria-label="입력">
      <form id="team-form" novalidate>
        <div class="field">
          <div class="field-head">
            <label for="participants">참가자 이름</label>
            <span id="participant-count" class="count">0명</span>
          </div>
          <textarea id="participants" rows="10" spellcheck="false" autocomplete="off"
            placeholder="한 줄에 한 명씩 입력하세요"></textarea>
          <p class="hint">2~60명 · 이름은 30자 이하 · 빈 줄은 무시합니다.</p>
        </div>

        <div class="options">
          <div class="field team-field">
            <label for="team-count">팀 수</label>
            <select id="team-count"></select>
          </div>
          <button type="button" id="sample-button" class="button subtle">예시 이름 넣기</button>
        </div>

        <p id="error" class="error" role="alert" hidden></p>

        <div class="actions">
          <button type="submit" id="assign-button" class="button primary">팀 배정하기</button>
          <button type="button" id="shuffle-button" class="button" disabled>다시 섞기</button>
          <button type="button" id="reset-button" class="button subtle">입력 초기화</button>
        </div>
      </form>
    </section>

    <section id="result" class="result" aria-live="polite" hidden>
      <div class="result-head">
        <h2>배정 결과</h2>
        <p id="result-summary"></p>
      </div>
      <ol id="teams" class="teams"></ol>
    </section>

    <footer class="footer">참가자 명단과 결과는 서버에 저장하지 않습니다.</footer>
  </main>
</body>
</html>
